# /etc/nginx/sites-available/business.mongol.net
# HTTPS is added by: sudo certbot --nginx -d business.mongol.net

upstream mongolnet_b2b {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name business.mongol.net;

    access_log /var/log/nginx/business.mongol.net.access.log;
    error_log  /var/log/nginx/business.mongol.net.error.log warn;

    location / {
        proxy_pass http://mongolnet_b2b;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout 60s;
    }
}
