name: mongolnet-b2b

services:
  mongolnet-b2b:
    image: repo.nextsocial.mn/mongolnet_b2b_prod:${IMAGE_TAG:-latest}
    container_name: mongolnet-b2b
    restart: unless-stopped
    ports:
      # only reachable through nginx on the host
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      # contact form mail, set in deploy/.env (see README)
      MAIL_HOST: ${MAIL_HOST:-smtp.office365.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_NO_REPLY_USER: ${MAIL_NO_REPLY_USER:-noreply@nextsocial.mn}
      MAIL_NO_REPLY_PASSWORD: ${MAIL_NO_REPLY_PASSWORD:-}
      MAIL_NO_REPLY_FROM: ${MAIL_NO_REPLY_FROM:-noreply@nextsocial.mn}
      CONTACT_TO: ${CONTACT_TO:-contact@nextsocial.mn}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
